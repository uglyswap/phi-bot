name: Phi Bot Docker image

# Image ghcr.io/uglyswap/phi-bot built from the published npm package (spec 14, plan F).
# Build, smoke test, then push of the exact tested image: nothing is pushed if a step fails.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version de @phi-code-admin/phi-bot déjà publiée sur npm (exemple : 1.0.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: phibot-docker
  cancel-in-progress: false

jobs:
  image:
    name: Construire, tester, publier
    if: github.repository == 'uglyswap/phi-bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/uglyswap/phi-bot
      VERSION: ${{ inputs.version }}
    steps:
      - name: Contrôler la version demandée
        id: version
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$VERSION" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'; then
            echo "::error::Version invalide : $VERSION"
            exit 1
          fi
          published="$(npm view "@phi-code-admin/phi-bot@$VERSION" version)"
          if [ "$published" != "$VERSION" ]; then
            echo "::error::@phi-code-admin/phi-bot@$VERSION n'est pas publié sur npm."
            exit 1
          fi
          case "$VERSION" in
            *-*) echo "latest=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "latest=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lire la liste --allow-scripts du CLI
        id: allow
        run: |
          set -euo pipefail
          list="$(node -e '
            const src = require("fs").readFileSync(process.argv[1], "utf8");
            const match = /PHIBOT_NPM_ALLOW_SCRIPTS = \[([^\]]*)\]/.exec(src);
            const names = match ? [...match[1].matchAll(/"([^"]+)"/g)].map((m) => m[1]) : [];
            if (names.length === 0) process.exit(1);
            console.log(names.join(","));
          ' cli/src/phibot/constants.ts)"
          echo "Liste --allow-scripts : $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construire l'image (chargée localement, pas encore publiée)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: phibot/docker
          file: phibot/docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            PHIBOT_VERSION=${{ inputs.version }}
            PHIBOT_NPM_ALLOW_SCRIPTS=${{ steps.allow.outputs.list }}
          tags: ${{ env.IMAGE }}:${{ inputs.version }}
          pull: true
          no-cache: true
          load: true
          push: false
          provenance: false

      - name: Test fumée du conteneur
        run: bash phibot/docker/smoke-test.sh "$IMAGE:$VERSION"

      - name: Se connecter à ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image testée
        env:
          MOVE_LATEST: ${{ steps.version.outputs.latest }}
        run: |
          set -euo pipefail
          docker push "$IMAGE:$VERSION"
          if [ "$MOVE_LATEST" = "true" ]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          else
            echo "Préversion $VERSION : le tag latest n'est pas déplacé."
          fi
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")"
          echo "Image publiée : $digest"
          {
            echo "### Image Phi Bot publiée"
            echo ""
            echo "- \`$IMAGE:$VERSION\`"
            if [ "$MOVE_LATEST" = "true" ]; then echo "- \`$IMAGE:latest\`"; fi
            echo "- empreinte : \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
